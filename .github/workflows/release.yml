name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple

      # A direct `gh pr merge` here would be a GITHUB_TOKEN-attributed
      # push, which (like GITHUB_TOKEN-created PRs) doesn't cascade into
      # triggering the next release.yml run, so release-please's second
      # phase (cutting the actual tag once this commit lands) would never
      # fire. `--auto` instead enables GitHub's own background auto-merge,
      # whose resulting merge commit is not GITHUB_TOKEN-attributed and
      # does cascade normally (confirmed: this is exactly how v1.0.0's
      # merge triggered its own publish run, 2026-08-27).
      - name: Auto-merge the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.number')
          gh pr merge "$pr_number" --squash --auto --repo "${{ github.repository }}"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest
